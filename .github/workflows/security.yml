name: Security checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Per-PR gate. Security only, and deliberately free of the Python engine setup
  # and the Playwright suite so it stays in the low minutes. Application
  # behaviour is verified live before deployment; what cannot be verified that
  # way is dependency provenance and the credential, SSRF and redaction
  # boundaries, so that is what runs here.
  security-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical release-gate coverage
        run: npm run test:release-gate-coverage

      - name: Run the security gate
        run: npm run security:gate

  # Full suite, on demand and weekly. Everything the security gate leaves out
  # lives here: the Python dependency audit, typecheck, lint, build, bundle
  # budgets, every unit contract, and the Playwright suite. Run it from the
  # Actions tab before a release, or let the Monday cron catch drift.
  full-gate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: npm ci

      - name: Install first-party migration engine
        env:
          OMNIKIT_MIGRATION_ENGINE_BOOTSTRAP_PYTHON: python
        run: npm run setup:migration-engine:test

      - name: Verify first-party migration engine
        run: npm run verify:migration-engine:internal

      - name: Verify installed first-party migration engine
        run: npm run verify:migration-engine

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Run canonical security and release gate
        run: npm run security:check
